<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #101211; }
  body { display: grid; place-items: center; }
  /* 12% safe padding per side — mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- the bare track ring + a single red tick: the "explained" family variant of looptrace's mark -->
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="4" y="7" width="24" height="18" rx="9" fill="none" stroke="#D9E4D6" stroke-width="2.6"/>
    <circle cx="16" cy="7" r="3.6" fill="#E8506B"/>
    <path d="M13.2 12.4 L20.4 16 L13.2 19.6 Z" fill="#D9E4D6"/>
  </svg>
</body>
</html>
